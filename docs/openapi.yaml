openapi: 3.0.3

info:
  title: PIOMS 商品库存与订单管理系统 API
  version: 1.4.0
  description: |
    当前文档描述商品查询、商品入库以及订单创建、查询和取消接口。
    订单价格、订单总额、订单号和下单用户均由服务端确定，客户端不能自行指定。

servers:
  - url: http://127.0.0.1:8000
    description: 本地 Django 开发服务器

tags:
  - name: Products
    description: 商品查询接口
  - name: Orders
    description: 订单接口

paths:
  /api/products/:
    get:
      tags:
        - Products
      summary: 查询商品列表
      description: |
        返回经过分页的商品列表。可以按商品名称或 SKU 搜索，按库存状态和价格区间筛选，并选择排序方式。
        多个 Query 参数可以组合使用；所有筛选均由 MySQL 完成。
      operationId: listProducts
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: search
          in: query
          required: false
          description: 在商品名称和 SKU 中进行不区分大小写的包含搜索。
          schema:
            type: string
            minLength: 1
            maxLength: 200
          example: 手机
        - name: in_stock
          in: query
          required: false
          description: true 表示只查库存大于 0 的商品，false 表示只查库存等于 0 的商品。
          schema:
            type: boolean
          example: true
        - name: min_price
          in: query
          required: false
          description: 最低价格，包含该价格。
          schema:
            type: number
            format: decimal
            minimum: 0
          example: 1000.00
        - name: max_price
          in: query
          required: false
          description: 最高价格，包含该价格，且不能低于 min_price。
          schema:
            type: number
            format: decimal
            minimum: 0
          example: 3000.00
        - name: ordering
          in: query
          required: false
          description: 排序字段；字段名前的减号表示倒序。默认按照创建时间倒序。
          schema:
            type: string
            default: -created_at
            enum:
              - price
              - -price
              - sales
              - -sales
              - name
              - -name
              - created_at
              - -created_at
          example: -sales
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始，每页 10 条。
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
      responses:
        "200":
          description: 商品列表查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedProductList"
              example:
                count: 1
                next: null
                previous: null
                results:
                  - id: 3
                    sku: PHONE-001
                    name: 测试手机
                    price: "1999.00"
                    stock: 9
                    sales: 1
        "400":
          description: 筛选或排序参数不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              example:
                max_price:
                  - 最高价格不能低于最低价格。
        "401":
          description: 未提供认证信息，或者 Basic Auth 用户名、密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 请求的页码不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"

  /api/products/{id}/:
    get:
      tags:
        - Products
      summary: 查询商品详情
      description: 根据商品数据库主键返回一个商品对象。
      operationId: retrieveProduct
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: products_product 表中的商品主键 ID。
          schema:
            type: integer
            minimum: 1
          example: 3
      responses:
        "200":
          description: 商品详情查询成功
          headers:
            X-Cache:
              description: MISS 表示本次查询了 MySQL 并写入 Redis；HIT 表示直接从 Redis 返回。
              schema:
                type: string
                enum:
                  - HIT
                  - MISS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 3
                sku: PHONE-001
                name: 测试手机
                price: "1999.00"
                stock: 9
                sales: 1
        "401":
          description: 未提供认证信息，或者 Basic Auth 用户名、密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
              example:
                detail: 未找到。

  /api/products/{id}/stock-in/:
    post:
      tags:
        - Products
      summary: 商品入库
      description: |
        给指定商品增加库存，只有 Django 后台员工账号（is_staff=true）可以调用。
        服务端使用 MySQL 事务和行锁更新库存，提交成功后删除该商品的 Redis 详情缓存。
        入库只增加 stock，不会修改累计销量 sales。
      operationId: stockInProduct
      security:
        - basicAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: 要补充库存的商品主键 ID。
          schema:
            type: integer
            minimum: 1
          example: 3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductStockInRequest"
            example:
              quantity: 100
      responses:
        "200":
          description: 入库成功，返回库存更新后的商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
              example:
                id: 3
                sku: PHONE-001
                name: 测试手机
                price: "1999.00"
                stock: 100
                sales: 20
        "400":
          description: quantity 缺失、不是整数或小于 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          description: 未提供认证信息，或者认证信息错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "403":
          description: 当前用户不是后台员工
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 商品不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"

  /api/orders/:
    get:
      tags:
        - Orders
      summary: 查询当前用户的订单列表
      description: |
        分页返回当前认证用户自己的订单，并包含每张订单的明细。
        其他用户的订单不会出现在结果中，每页默认返回 10 条。
      operationId: listOrders
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          required: false
          description: 页码，从 1 开始，每页 10 条。
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: 当前用户的订单列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedOrderList"
        "401":
          description: 未提供认证信息，或者认证信息错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 请求的页码不存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"

    post:
      tags:
        - Orders
      summary: 创建订单
      description: |
        使用当前认证用户创建一张订单，并在同一个 MySQL 事务中创建订单明细、扣减库存和增加销量。
        同一商品出现多次时，服务端会先合并数量。任一商品不存在或库存不足时，整笔操作失败并回滚。
      operationId: createOrder
      security:
        - basicAuth: []
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateRequest"
            examples:
              oneProduct:
                summary: 购买一种商品
                value:
                  items:
                    - product_id: 3
                      quantity: 1
              multipleProducts:
                summary: 购买多种商品
                value:
                  items:
                    - product_id: 3
                      quantity: 2
                    - product_id: 4
                      quantity: 1
      responses:
        "201":
          description: 订单创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              example:
                id: 1
                order_no: ORD20260926A2CB14559E7D47AC86F2
                status: pending
                total_amount: "1999.00"
                items:
                  - product_id: 3
                    product_name: 测试手机
                    quantity: 1
                    unit_price: "1999.00"
                    subtotal: "1999.00"
                created_at: "2026-09-26T20:08:00+08:00"
                updated_at: "2026-09-26T20:08:00+08:00"
        "400":
          description: JSON 格式错误、字段校验失败或商品不存在
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationError"
                  - $ref: "#/components/schemas/ProductNotFoundError"
              examples:
                invalidQuantity:
                  summary: 数量不是正整数
                  value:
                    items:
                      - quantity:
                          - 请确保该值大于或者等于 1。
                productNotFound:
                  summary: 商品不存在
                  value:
                    code: product_not_found
                    detail: 商品不存在：999
                    product_ids:
                      - 999
        "401":
          description: 未提供认证信息，或者 Basic Auth 用户名、密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
              example:
                detail: 身份认证信息未提供。
        "409":
          description: 商品库存不足，订单和库存修改均会回滚
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientStockError"
              example:
                code: insufficient_stock
                detail: 商品 3 库存不足：需要 20，当前库存 10
                product_id: 3
                requested: 20
                available: 10
        "405":
          description: 使用了 GET、POST 以外的请求方法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"

  /api/orders/{id}/:
    get:
      tags:
        - Orders
      summary: 查询当前用户的一张订单
      description: |
        返回指定订单及其订单明细。只能查询当前认证用户自己的订单；
        订单不存在或属于其他用户时都返回 404，避免泄露其他用户的订单信息。
      operationId: retrieveOrder
      security:
        - basicAuth: []
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: orders_order 表中的订单主键 ID。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 订单详情查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: 未提供认证信息，或者认证信息错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 订单不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"

  /api/orders/{id}/cancel/:
    post:
      tags:
        - Orders
      summary: 取消当前用户的待处理订单
      description: |
        只有 pending 状态的订单可以取消。服务端会在同一个 MySQL 事务中把订单改为 cancelled、
        恢复商品库存并扣回销量；事务成功提交后删除相关商品详情缓存。
      operationId: cancelOrder
      security:
        - basicAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: 要取消的订单主键 ID。
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 订单取消成功，返回更新后的订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: 未提供认证信息，或者认证信息错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailError"
        "404":
          description: 订单不存在或不属于当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotFoundError"
        "409":
          description: 订单当前状态不允许取消
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderNotCancellableError"
              example:
                code: order_not_cancellable
                detail: 订单 1 当前状态为 cancelled，不能取消
                current_status: cancelled

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Apifox 本地调试推荐方式。用户名和密码使用 Django 用户账号。
        Basic Auth 只进行 Base64 编码，并非加密；正式环境必须使用 HTTPS。
    sessionCookie:
      type: apiKey
      in: cookie
      name: sessionid
      description: 浏览器通过 /api-auth/login/ 登录后取得的 Django Session Cookie。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRFToken
      description: 使用 Session 认证发送 POST 时必须提供，与 csrftoken Cookie 的值一致。

  schemas:
    Product:
      type: object
      required:
        - id
        - sku
        - name
        - price
        - stock
        - sales
      properties:
        id:
          type: integer
          readOnly: true
          description: 商品数据库主键。
        sku:
          type: string
          readOnly: true
          description: 商品的唯一库存单位编码。
        name:
          type: string
          readOnly: true
          description: 商品名称。
        price:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          readOnly: true
          description: 商品当前价格。
        stock:
          type: integer
          minimum: 0
          readOnly: true
          description: MySQL 中记录的当前库存。
        sales:
          type: integer
          minimum: 0
          readOnly: true
          description: 累计销量。

    PaginatedProductList:
      type: object
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          minimum: 0
          description: 符合筛选条件的商品总数。
        next:
          type: string
          format: uri
          nullable: true
          description: 下一页地址；没有下一页时为 null。
        previous:
          type: string
          format: uri
          nullable: true
          description: 上一页地址；没有上一页时为 null。
        results:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    ProductStockInRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          description: 本次增加的库存数量，必须是正整数。
          example: 100

    OrderCreateRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: 要购买的商品明细，至少包含一项。
          items:
            $ref: "#/components/schemas/OrderItemCreate"

    OrderItemCreate:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          minimum: 1
          description: products_product 表中商品的主键 ID。
          example: 3
        quantity:
          type: integer
          minimum: 1
          description: 购买数量，必须是正整数。
          example: 1

    Order:
      type: object
      required:
        - id
        - order_no
        - status
        - total_amount
        - items
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          readOnly: true
          description: 订单数据库主键。
        order_no:
          type: string
          readOnly: true
          description: 服务端生成的唯一订单号。
        status:
          type: string
          enum:
            - pending
            - paid
            - cancelled
          readOnly: true
          description: 订单状态；新订单为 pending，取消后为 cancelled。
        total_amount:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          readOnly: true
          description: 服务端根据数据库商品价格计算的订单总额。
        items:
          type: array
          readOnly: true
          items:
            $ref: "#/components/schemas/OrderItem"
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true

    PaginatedOrderList:
      type: object
      required:
        - count
        - next
        - previous
        - results
      properties:
        count:
          type: integer
          minimum: 0
          description: 当前用户的订单总数。
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: "#/components/schemas/Order"

    OrderItem:
      type: object
      required:
        - product_id
        - product_name
        - quantity
        - unit_price
        - subtotal
      properties:
        product_id:
          type: integer
          readOnly: true
        product_name:
          type: string
          readOnly: true
        quantity:
          type: integer
          readOnly: true
        unit_price:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          readOnly: true
          description: 下单时的商品价格快照。
        subtotal:
          type: string
          pattern: "^-?[0-9]+\\.[0-9]{2}$"
          readOnly: true
          description: unit_price 乘以 quantity。

    ValidationError:
      type: object
      description: DRF Serializer 返回的字段校验错误。
      additionalProperties: true

    ProductNotFoundError:
      type: object
      required:
        - code
        - detail
        - product_ids
      properties:
        code:
          type: string
          enum:
            - product_not_found
        detail:
          type: string
        product_ids:
          type: array
          items:
            type: integer

    InsufficientStockError:
      type: object
      required:
        - code
        - detail
        - product_id
        - requested
        - available
      properties:
        code:
          type: string
          enum:
            - insufficient_stock
        detail:
          type: string
        product_id:
          type: integer
        requested:
          type: integer
        available:
          type: integer

    OrderNotFoundError:
      type: object
      required:
        - code
        - detail
      properties:
        code:
          type: string
          enum:
            - order_not_found
        detail:
          type: string

    OrderNotCancellableError:
      type: object
      required:
        - code
        - detail
        - current_status
      properties:
        code:
          type: string
          enum:
            - order_not_cancellable
        detail:
          type: string
        current_status:
          type: string
          enum:
            - paid
            - cancelled

    DetailError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
